databaseChangeLog:
  # 1. Reference table attributes
  - changeSet:
      id: 0002-1-add-item-type-attributes
      author: furniture-calculator
      changes:
        - addColumn:
            tableName: item_type
            columns:
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_item_type_code

  - changeSet:
      id: 0002-2-add-leaf-type-attributes
