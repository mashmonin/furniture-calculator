databaseChangeLog:
  # Фурнитура прайс-листа «Фурнитура» prays_list_furnitura_tsfo_01_02_2026 (PL-003) — change add-hardware-service:
  # листы HAUSDOORS, Fantom, Vantage; разделы файла — категории (с брендом в названии), строки с артикулом —
  # цветовые варианты. Первая цифра цены в прайсе — дилерская, вторая — розничная; строка без розничной цены
  # (FNT0002, «Образец») не заводится. HAUSDOORS и Fantom: тип — наименование без цвета, варианты с одним
  # наименованием объединены; Vantage: один артикул — один тип «Vantage <артикул>» (в файле модель и цвет
  # закодированы в артикуле, наименование — это цвет). Строки без цвета — «Без цвета». Сгенерировано из файла
  # разовым скриптом. Только переносимый SQL (PostgreSQL и H2).
  - changeSet:
      id: 0127-1-insert-furnitura-price-list
      author: furniture-calculator
      changes:
        - insert:
            tableName: price_list
            columns:
              - column: { name: name, value: "prays_list_furnitura_tsfo_01_02_2026" }
              - column: { name: code, value: "PL-003" }
      rollback:
        - sql:
            sql: >-
              DELETE FROM price_list WHERE code = 'PL-003'

