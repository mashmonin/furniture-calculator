databaseChangeLog:
  - changeSet:
      id: 0078-1-insert-hardware-category-hinges-italy
      author: furniture-calculator
      changes:
        - insert:
            tableName: hardware_category
            columns:
              - column: { name: name, value: "Петли Италия" }
              - column: { name: code, value: "HWG-002" }

  - changeSet:
      id: 0078-2-insert-hardware-types-hinges-italy
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO hardware_type (name, code, unit, hardware_category_id)
              SELECT v.name, v.code, v.unit, hc.id
              FROM (VALUES
                ('Петля компланар скрытая А (KRONA KOBLENZ, пр-во Италия) (Kubica 6360 45)', 'HWT-007', 'шт'),
                ('Петля компланар скрытая Н - для обратного открывания 44 мм (KRONA KOBLENZ, пр-во Италия) (Kubica 2460)', 'HWT-008', 'шт'),
                ('Петля компланар скрытая Z - для полотен с зеркалом на всю плоскость (KRONA KOBLENZ, пр-во Италия) (Kubica 2760)', 'HWT-009', 'шт')
              ) AS v(name, code, unit)
              CROSS JOIN hardware_category hc
              WHERE hc.code = 'HWG-002'

  - changeSet:
      id: 0078-3-insert-hardware-options-hinge-a
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO hardware_option (colour_name, retail_price, dealer_price, hardware_type_id)
              SELECT v.colour_name, v.retail_price, v.dealer_price, ht.id
              FROM (VALUES
                ('бронза', 4250, 2833),
                ('белый', 4373, 2915),
                ('золото глянец', 5940, 3960),
                ('матовое золото', 5012, 3341),
                ('матовый хром', 3795, 2530),
                ('черный', 4373, 2915)
              ) AS v(colour_name, retail_price, dealer_price)
              CROSS JOIN hardware_type ht
              WHERE ht.code = 'HWT-007'

