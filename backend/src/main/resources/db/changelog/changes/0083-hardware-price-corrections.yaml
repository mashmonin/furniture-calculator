databaseChangeLog:
  # Обновлённый прайс-лист фурнитуры от поставщика: корректировка цен категории «Замки, цилиндры»
  # (HWG-001, все 6 типов), части «Петли Armadillo» (HWG-003) и «Ручки для раздвижных дверей» (HWG-006).
  # Затронутые changeset'ы (0077, 0079, 0082) уже применены — правим данные новым changeset'ом, а не
  # редактируем их задним числом (см. CLAUDE.md).
  - changeSet:
      id: 0083-1-update-hardware-prices-agb-wc-96
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              UPDATE hardware_option SET retail_price = 2048, dealer_price = 1365
              WHERE colour_name = 'матовый хром' AND hardware_type_id = (SELECT id FROM hardware_type WHERE code = 'HWT-001')
        - sql:
            sql: >-
              UPDATE hardware_option SET retail_price = 2154, dealer_price = 1436
              WHERE colour_name = 'черный' AND hardware_type_id = (SELECT id FROM hardware_type WHERE code = 'HWT-001')
        - sql:
            sql: >-
              UPDATE hardware_option SET retail_price = 3261, dealer_price = 2174
              WHERE colour_name = 'латунь матовая' AND hardware_type_id = (SELECT id FROM hardware_type WHERE code = 'HWT-001')
        - sql:
            sql: >-
              UPDATE hardware_option SET retail_price = 2262, dealer_price = 1508
              WHERE colour_name = 'латунь полированная' AND hardware_type_id = (SELECT id FROM hardware_type WHERE code = 'HWT-001')
        - sql:
            sql: >-
              UPDATE hardware_option SET retail_price = 2244, dealer_price = 1496
              WHERE colour_name = 'никель (хром глянец)' AND hardware_type_id = (SELECT id FROM hardware_type WHERE code = 'HWT-001')
        - sql:
            sql: >-
              UPDATE hardware_option SET retail_price = 2625, dealer_price = 1750
              WHERE colour_name = 'античная бронза' AND hardware_type_id = (SELECT id FROM hardware_type WHERE code = 'HWT-001')

