databaseChangeLog:
  # Названия категорий фурнитуры «Фурнитура» (PL-003) без префикса бренда (change add-hardware-service): бренд
  # выбирается отдельным шагом на экране сервиса и хранится в hardware_type.brand, поэтому в названии раздела он
  # лишний («Fantom: Дверные ручки» → «Дверные ручки»). Только переносимый SQL (PostgreSQL и H2).
  - changeSet:
      id: 0128-1-furnitura-category-names-without-brand
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              UPDATE hardware_category SET name = 'Ручки дверные' WHERE code = 'HWG-014'
