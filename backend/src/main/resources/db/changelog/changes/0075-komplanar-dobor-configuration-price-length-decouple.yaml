databaseChangeLog:
  - changeSet:
      id: 0075-1-komplanar-dobor-configuration-price-length-decouple
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              UPDATE configuration_price
              SET length_option_id = NULL
              WHERE frame_extensions_type_id IN (
                SELECT id FROM frame_extensions_type
                WHERE code IN ('FET-008', 'FET-009', 'FET-010', 'FET-011', 'FET-012', 'FET-013')
              )
