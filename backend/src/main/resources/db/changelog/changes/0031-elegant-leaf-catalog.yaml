databaseChangeLog:
  - changeSet:
      id: 0031-1-insert-elegant-length-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, is_standard, leaf_type_id)
              SELECT dt.id, v.value, true, lt.id
              FROM liner_dimension_type dt
              CROSS JOIN (VALUES (600), (700), (800)) AS v(value)
              CROSS JOIN leaf_type lt
              WHERE dt.code = 'DT-001'
                AND lt.code IN ('LT-014', 'LT-015', 'LT-016', 'LT-017', 'LT-018', 'LT-019')

  - changeSet:
      id: 0031-2-insert-elegant-height-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, is_standard, leaf_type_id)
              SELECT dt.id, v.value, true, lt.id
              FROM liner_dimension_type dt
              CROSS JOIN (VALUES (2000), (2100)) AS v(value)
              CROSS JOIN leaf_type lt
              WHERE dt.code = 'DT-002'
                AND lt.code IN ('LT-014', 'LT-015', 'LT-016', 'LT-017', 'LT-018', 'LT-019')

  - changeSet:
      id: 0031-3-insert-elegant-thickness-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, is_standard, leaf_type_id)
              SELECT dt.id, v.value, true, lt.id
              FROM liner_dimension_type dt
              CROSS JOIN (VALUES (44)) AS v(value)
              CROSS JOIN leaf_type lt
              WHERE dt.code = 'DT-003'
                AND lt.code IN ('LT-014', 'LT-015', 'LT-016', 'LT-017', 'LT-018', 'LT-019')

  - changeSet:
      id: 0031-4-insert-elegant-door-configurations
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO door_configuration (leaf_type_id)
              SELECT id FROM leaf_type
              WHERE code IN ('LT-014', 'LT-015', 'LT-016', 'LT-017', 'LT-018', 'LT-019')

  - changeSet:
      id: 0031-5-insert-elegant-gluhoe-prices
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO configuration_price (retail_price, dealer_price, leaf_type_id)
              SELECT 38932, 22245, id FROM leaf_type
              WHERE code IN ('LT-014', 'LT-015', 'LT-016')

  - changeSet:
      id: 0031-6-insert-elegant-glass-prices
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO configuration_price (retail_price, dealer_price, leaf_type_id)
              SELECT 43860, 25061, id FROM leaf_type
              WHERE code IN ('LT-017', 'LT-018', 'LT-019')
