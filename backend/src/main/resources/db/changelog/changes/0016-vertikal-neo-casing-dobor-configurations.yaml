databaseChangeLog:
  - changeSet:
      id: 0016-1-remove-vertikal-neo-dobor-ts-without-casing
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              DELETE FROM door_configuration
              WHERE door_casing_type_id IS NULL
                AND frame_type_id = (SELECT id FROM frame_type WHERE code = 'FT-003')
                AND frame_extensions_type_id IN (
                  SELECT id FROM frame_extensions_type WHERE code IN ('FET-004', 'FET-005', 'FET-006', 'FET-007')
                )

  - changeSet:
      id: 0016-2-insert-vertikal-neo-casing-dobor-configurations
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO door_configuration (leaf_type_id, frame_type_id, door_casing_type_id, frame_extensions_type_id)
              SELECT lt.id, ft.id, dct.id, fet.id
              FROM leaf_type lt
              CROSS JOIN frame_type ft
              CROSS JOIN door_casing_type dct
              CROSS JOIN frame_extensions_type fet
              WHERE lt.code IN ('LT-001', 'LT-002', 'LT-003', 'LT-004', 'LT-005', 'LT-006', 'LT-007')
                AND ft.code = 'FT-003'
                AND dct.code IN ('DCT-003', 'DCT-004')
                AND fet.code IN ('FET-004', 'FET-005', 'FET-006', 'FET-007')
