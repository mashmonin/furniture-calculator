databaseChangeLog:
  - changeSet:
      id: 0025-1-insert-edge-colour-type-data
      author: furniture-calculator
      changes:
        - insert:
            tableName: colour_type
            columns:
              - column: { name: name, value: "Хром матовый" }
              - column: { name: code, value: "CT-023" }
        - insert:
            tableName: colour_type
            columns:
              - column: { name: name, value: "Бронза" }
              - column: { name: code, value: "CT-024" }
        - insert:
            tableName: colour_type
            columns:
              - column: { name: name, value: "Черный" }
              - column: { name: code, value: "CT-025" }
        - insert:
            tableName: colour_type
            columns:
              - column: { name: name, value: "Золото матовое" }
              - column: { name: code, value: "CT-026" }
        - insert:
            tableName: colour_type
            columns:
              - column: { name: name, value: "Покраска по RAL" }
              - column: { name: code, value: "CT-027" }

  - changeSet:
      id: 0025-2-insert-edge-height-dimension-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, min_value, is_standard, edge_type_id)
              SELECT ldt.id, v.value, v.min_value, true, et.id
              FROM (VALUES
                ('ET-001', 2100::numeric, NULL::numeric),
                ('ET-001', 2400::numeric, 2150::numeric),
                ('ET-001', 2700::numeric, 2450::numeric),
                ('ET-001', 2950::numeric, 2750::numeric),
                ('ET-002', 2100::numeric, NULL::numeric),
                ('ET-002', 2400::numeric, 2150::numeric),
                ('ET-002', 2700::numeric, 2450::numeric),
                ('ET-002', 2950::numeric, 2750::numeric)
              ) AS v(edge_code, value, min_value)
              JOIN edge_type et ON et.code = v.edge_code
              CROSS JOIN liner_dimension_type ldt
              WHERE ldt.code = 'DT-002'

  - changeSet:
      id: 0025-3-insert-edge-colour-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO colour_option (colour_type_id, edge_type_id)
              SELECT ct.id, et.id
              FROM (VALUES ('ET-001'), ('ET-002')) AS e(edge_code)
              JOIN edge_type et ON et.code = e.edge_code
              CROSS JOIN colour_type ct
              WHERE ct.code IN ('CT-023', 'CT-024', 'CT-025', 'CT-026', 'CT-027')

