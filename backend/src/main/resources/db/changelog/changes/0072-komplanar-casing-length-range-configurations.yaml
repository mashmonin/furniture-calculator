databaseChangeLog:
  - changeSet:
      id: 0072-1-repurpose-komplanar-casing-existing-length-option-as-first-range
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              UPDATE liner_dimension_option
              SET value = 2250, min_value = 1900, max_value = 2100
              WHERE value = 2100
                AND liner_dimension_type_id = (SELECT id FROM liner_dimension_type WHERE code = 'DT-001')
                AND door_casing_type_id IN (
                  SELECT id FROM door_casing_type
                  WHERE code IN ('DCT-001', 'DCT-002', 'DCT-005', 'DCT-006', 'DCT-007', 'DCT-008', 'DCT-009')
                )

  - changeSet:
      id: 0072-2-insert-evo-additional-length-range-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, min_value, max_value, is_standard, door_casing_type_id)
              SELECT ldt.id, v.value, v.min_value, v.max_value, true, dct.id
              FROM (VALUES
                (2400::numeric, 2150::numeric, 2250::numeric),
                (2700::numeric, 2300::numeric, 2300::numeric),
                (2700::numeric, 2350::numeric, 2550::numeric),
                (3000::numeric, 2600::numeric, 2850::numeric)
              ) AS v(value, min_value, max_value)
              CROSS JOIN (SELECT id FROM door_casing_type WHERE code = 'DCT-001') AS dct(id)
              CROSS JOIN liner_dimension_type ldt
              WHERE ldt.code = 'DT-001'

  - changeSet:
      id: 0072-3-insert-avenue-ariya-aura-additional-length-range-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, min_value, max_value, is_standard, door_casing_type_id)
              SELECT ldt.id, v.value, v.min_value, v.max_value, true, dct.id
              FROM (VALUES
                (2700::numeric, 2150::numeric, 2250::numeric),
                (2700::numeric, 2300::numeric, 2300::numeric),
                (2700::numeric, 2350::numeric, 2550::numeric)
              ) AS v(value, min_value, max_value)
              CROSS JOIN (
                SELECT id FROM door_casing_type WHERE code IN ('DCT-002', 'DCT-005', 'DCT-006', 'DCT-007', 'DCT-008', 'DCT-009')
              ) AS dct(id)
              CROSS JOIN liner_dimension_type ldt
              WHERE ldt.code = 'DT-001'
