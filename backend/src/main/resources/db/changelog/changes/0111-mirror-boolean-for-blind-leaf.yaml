databaseChangeLog:
  - changeSet:
      id: 0111-1-reclassify-mirrored-leaf-type-as-blind
      author: furniture-calculator
      comment: >-
        Зеркало перестаёт быть отдельным значением panel_type «с зеркалом» (MIRRORED)
        и становится опциональным исполнением глухого полотна. На момент написания
        этого changeset panel_type = 'MIRRORED' было проставлено у leaf_type: LT-014,
        LT-015, LT-016 (ЭЛЕГАНТ 01/02/021), LT-020, LT-021, LT-022 (ГАРМОНИЯ 01/02/021),
        LT-026..LT-029 (СВОБОДА 01/02/021/03), LT-034, LT-035 (ГЕОМЕТРИЯ 01/02),
        LT-038 (СИЯНИЕ 01), LT-039..LT-044 (СИБИРЬ 01-06), LT-045 (ФАНТОМ 01) — все
        переклассифицируются в «глухое» (BLIND); их строки mirror_finish_option не
        меняются. UPDATE ниже не привязан к конкретным id, чтобы корректно
        переклассифицировать все строки MIRRORED независимо от состояния данных на
        момент фактического применения changeset.
      changes:
        - sql:
            sql: >-
              UPDATE leaf_type SET panel_type = 'BLIND' WHERE panel_type = 'MIRRORED'

  - changeSet:
      id: 0111-2-narrow-leaf-type-panel-type-check
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              ALTER TABLE leaf_type DROP CONSTRAINT chk_leaf_type_panel_type
        - sql:
            sql: >-
              ALTER TABLE leaf_type ADD CONSTRAINT chk_leaf_type_panel_type
              CHECK (panel_type IN ('BLIND', 'GLAZED'))
      rollback:
        - sql:
            sql: >-
              ALTER TABLE leaf_type DROP CONSTRAINT chk_leaf_type_panel_type
        - sql:
            sql: >-
              ALTER TABLE leaf_type ADD CONSTRAINT chk_leaf_type_panel_type
              CHECK (panel_type IN ('BLIND', 'GLAZED', 'MIRRORED'))

  - changeSet:
      id: 0111-3-mirror-finish-option-requires-blind-leaf-type
      author: furniture-calculator
      comment: >-
        Зеркало доступно только глухим полотнам — mirror_finish_option ДОЛЖЕН
        ссылаться исключительно на leaf_type с panel_type = 'BLIND'. PostgreSQL не
        поддерживает CHECK с подзапросом к другой таблице, поэтому целостность
        обеспечивается BEFORE INSERT/UPDATE триггером.
      changes:
        - sql:
            splitStatements: false
            sql: >-
              CREATE FUNCTION chk_mirror_finish_option_leaf_type_blind() RETURNS trigger AS $$
              BEGIN
                IF (SELECT lt.panel_type FROM leaf_type lt WHERE lt.id = NEW.leaf_type_id) <> 'BLIND' THEN
                  RAISE EXCEPTION 'mirror_finish_option.leaf_type_id must reference a leaf_type with panel_type = BLIND'
                    USING ERRCODE = 'check_violation';
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql
        - sql:
            sql: >-
              CREATE TRIGGER trg_mirror_finish_option_leaf_type_blind
              BEFORE INSERT OR UPDATE OF leaf_type_id ON mirror_finish_option
              FOR EACH ROW EXECUTE FUNCTION chk_mirror_finish_option_leaf_type_blind()
      rollback:
        - sql:
            sql: >-
              DROP TRIGGER trg_mirror_finish_option_leaf_type_blind ON mirror_finish_option
        - sql:
            sql: >-
              DROP FUNCTION chk_mirror_finish_option_leaf_type_blind()
