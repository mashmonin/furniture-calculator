databaseChangeLog:
  - changeSet:
      id: 0076-1-create-hardware-category
      author: furniture-calculator
      changes:
        - createTable:
            tableName: hardware_category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_hardware_category_code

  - changeSet:
      id: 0076-2-create-hardware-type
      author: furniture-calculator
      changes:
        - createTable:
            tableName: hardware_type
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_hardware_type_code
              - column:
                  name: unit
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: hardware_category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_hardware_type_hardware_category
                    references: hardware_category(id)

  - changeSet:
      id: 0076-3-create-hardware-option
      author: furniture-calculator
      changes:
        - createTable:
            tableName: hardware_option
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: colour_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: retail_price
                  type: DECIMAL
                  constraints:
                    nullable: false
              - column:
                  name: dealer_price
                  type: DECIMAL
                  constraints:
                    nullable: false
              - column:
                  name: hardware_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_hardware_option_hardware_type
                    references: hardware_type(id)
