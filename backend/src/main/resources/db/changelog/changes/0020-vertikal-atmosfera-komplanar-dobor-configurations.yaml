databaseChangeLog:
  - changeSet:
      id: 0020-1-insert-vertikal-atmosfera-komplanar-dobor-configurations
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO door_configuration (leaf_type_id, frame_type_id, door_casing_type_id, frame_extensions_type_id)
              SELECT lt.id, ft.id, dct.id, fet.id
              FROM leaf_type lt
              CROSS JOIN frame_type ft
              CROSS JOIN door_casing_type dct
              CROSS JOIN frame_extensions_type fet
              WHERE lt.code IN (
                'LT-001', 'LT-002', 'LT-003', 'LT-004', 'LT-005', 'LT-006', 'LT-007',
                'LT-008', 'LT-009', 'LT-010', 'LT-011', 'LT-012', 'LT-013'
              )
                AND ft.code = 'FT-002'
                AND dct.code IN ('DCT-001', 'DCT-002')
                AND fet.code IN ('FET-008', 'FET-009', 'FET-010', 'FET-011', 'FET-012', 'FET-013')
