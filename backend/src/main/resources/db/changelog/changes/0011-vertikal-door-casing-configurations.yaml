databaseChangeLog:
  - changeSet:
      id: 0011-1-insert-vertikal-door-casing-configurations
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO door_configuration (leaf_type_id, frame_type_id, door_casing_type_id)
              SELECT lt.id, ft.id, dct.id
              FROM leaf_type lt
              CROSS JOIN frame_type ft
              CROSS JOIN door_casing_type dct
              WHERE lt.code IN ('LT-001', 'LT-002', 'LT-003', 'LT-004', 'LT-005', 'LT-006', 'LT-007')
                AND ft.code = 'FT-002'
                AND dct.code IN ('DCT-001', 'DCT-002')
