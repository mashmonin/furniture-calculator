databaseChangeLog:
  - changeSet:
      id: 0010-1-insert-door-casing-height-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, is_standard, door_casing_type_id)
              SELECT dt.id, 2100, true, dct.id
              FROM liner_dimension_type dt
              CROSS JOIN door_casing_type dct
              WHERE dt.code = 'DT-002'
                AND dct.code IN ('DCT-001', 'DCT-002')

  - changeSet:
      id: 0010-2-insert-door-casing-configuration-prices
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO configuration_price (retail_price, dealer_price, door_casing_type_id, height_option_id)
              SELECT v.retail_price, v.dealer_price, dct.id, ldo.id
              FROM (VALUES ('DCT-001', 2267, 1295), ('DCT-002', 3622, 2070)) AS v(code, retail_price, dealer_price)
              JOIN door_casing_type dct ON dct.code = v.code
              JOIN liner_dimension_option ldo ON ldo.door_casing_type_id = dct.id AND ldo.value = 2100
