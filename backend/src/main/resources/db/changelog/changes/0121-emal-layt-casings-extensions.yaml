databaseChangeLog:
  # Наличники «Light»/«Modo» и доборы «Neo 100 мм»/«Neo 190 мм» для моделей «Эмаль Лайт» (change
  # add-emal-layt-casings-extensions). Новые типы (цена привязана к типу, а не к коллекции, и отличается от
  # существующих «Модо»/«ТС»). Длина — по высоте полотна: наличники 2250 [полотно 2000] и 2400 [2100–2300],
  # доборы 2170 [2000] и 2400 [2100–2300]; цены явные по длине, за штуку, без процентных надбавок (правил
  # pogonazh_surcharge_rule для новых типов нет). Первая цифра цены в прайсе — дилерская, вторая — розничная.
  # Только переносимый SQL (PostgreSQL и H2).
  - changeSet:
      id: 0121-1-insert-emal-layt-casing-types
      author: furniture-calculator
      changes:
        - insert:
            tableName: door_casing_type
            columns:
              - column: { name: name, value: "Light" }
              - column: { name: code, value: "DCT-010" }
        - insert:
            tableName: door_casing_type
            columns:
              - column: { name: name, value: "Modo" }
              - column: { name: code, value: "DCT-011" }
      rollback:
        - sql:
            sql: >-
              DELETE FROM door_casing_type WHERE code IN ('DCT-010', 'DCT-011')

  - changeSet:
      id: 0121-2-insert-emal-layt-extension-types
      author: furniture-calculator
      changes:
        - insert:
            tableName: frame_extensions_type
            columns:
              - column: { name: name, value: "Добор Neo 100 мм" }
              - column: { name: code, value: "FET-014" }
              - column: { name: short_name, value: "100" }
        - insert:
            tableName: frame_extensions_type
            columns:
              - column: { name: name, value: "Добор Neo 190 мм" }
              - column: { name: code, value: "FET-015" }
              - column: { name: short_name, value: "190" }
      rollback:
        - sql:
            sql: >-
              DELETE FROM frame_extensions_type WHERE code IN ('FET-014', 'FET-015')

  - changeSet:
      id: 0121-3-insert-emal-layt-casing-length-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, min_value, max_value, is_standard, door_casing_type_id)
              SELECT ldt.id, v.value, v.min_value, v.max_value, true, dct.id
              FROM (VALUES
                (2250, 2000, 2000),
                (2400, 2100, 2300)
              ) AS v(value, min_value, max_value)
              CROSS JOIN door_casing_type dct
              CROSS JOIN liner_dimension_type ldt
              WHERE dct.code IN ('DCT-010', 'DCT-011')
                AND ldt.code = 'DT-001'
      rollback:
        - sql:
            sql: >-
              DELETE FROM liner_dimension_option
              WHERE door_casing_type_id IN (SELECT id FROM door_casing_type WHERE code IN ('DCT-010', 'DCT-011'))

  - changeSet:
      id: 0121-4-insert-emal-layt-extension-length-options
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              INSERT INTO liner_dimension_option (liner_dimension_type_id, value, min_value, max_value, is_standard, frame_extensions_type_id)
              SELECT ldt.id, v.value, v.min_value, v.max_value, true, fet.id
              FROM (VALUES
                (2170, 2000, 2000),
                (2400, 2100, 2300)
              ) AS v(value, min_value, max_value)
              CROSS JOIN frame_extensions_type fet
              CROSS JOIN liner_dimension_type ldt
              WHERE fet.code IN ('FET-014', 'FET-015')
                AND ldt.code = 'DT-001'
      rollback:
        - sql:
            sql: >-
              DELETE FROM liner_dimension_option
              WHERE frame_extensions_type_id IN (SELECT id FROM frame_extensions_type WHERE code IN ('FET-014', 'FET-015'))

  - changeSet:
      id: 0121-5-insert-emal-layt-casing-prices
      author: furniture-calculator
      comment: >-
        Наличники Light и Modo — одинаковые цены за штуку по длине: 2250 — 663/1094, 2400 — 767/1266 (дилер/розница).
      changes:
        - sql:
            sql: >-
              INSERT INTO configuration_price (retail_price, dealer_price, door_casing_type_id, length_option_id)
              SELECT v.retail_price, v.dealer_price, dct.id, lo.id
              FROM (VALUES
                ('DCT-010', 2250, 1094, 663),
                ('DCT-010', 2400, 1266, 767),
                ('DCT-011', 2250, 1094, 663),
                ('DCT-011', 2400, 1266, 767)
              ) AS v(casing_code, length_value, retail_price, dealer_price)
              JOIN door_casing_type dct ON dct.code = v.casing_code
              JOIN liner_dimension_type ldt ON ldt.code = 'DT-001'
              JOIN liner_dimension_option lo ON lo.door_casing_type_id = dct.id
                AND lo.liner_dimension_type_id = ldt.id AND lo.value = v.length_value
      rollback:
        - sql:
            sql: >-
              DELETE FROM configuration_price
              WHERE door_casing_type_id IN (SELECT id FROM door_casing_type WHERE code IN ('DCT-010', 'DCT-011'))

  - changeSet:
      id: 0121-6-insert-emal-layt-extension-prices
      author: furniture-calculator
      comment: >-
        Добор Neo 100 мм: 2170 — 806/1330, 2400 — 936/1544; Neo 190 мм: 2170 — 1274/2102, 2400 — 1469/2424 (дилер/розница).
      changes:
        - sql:
            sql: >-
              INSERT INTO configuration_price (retail_price, dealer_price, frame_extensions_type_id, length_option_id)
              SELECT v.retail_price, v.dealer_price, fet.id, lo.id
              FROM (VALUES
                ('FET-014', 2170, 1330, 806),
                ('FET-014', 2400, 1544, 936),
                ('FET-015', 2170, 2102, 1274),
                ('FET-015', 2400, 2424, 1469)
              ) AS v(extension_code, length_value, retail_price, dealer_price)
              JOIN frame_extensions_type fet ON fet.code = v.extension_code
              JOIN liner_dimension_type ldt ON ldt.code = 'DT-001'
              JOIN liner_dimension_option lo ON lo.frame_extensions_type_id = fet.id
                AND lo.liner_dimension_type_id = ldt.id AND lo.value = v.length_value
      rollback:
        - sql:
            sql: >-
              DELETE FROM configuration_price
              WHERE frame_extensions_type_id IN (SELECT id FROM frame_extensions_type WHERE code IN ('FET-014', 'FET-015'))

  - changeSet:
      id: 0121-7-insert-emal-layt-casing-extension-configurations
      author: furniture-calculator
      comment: >-
        Для каждой модели «Эмаль Лайт» с коробом «NEO 75» — сочетания наличник (нет/Light/Modo) × добор
        (нет/Neo 100/Neo 190), кроме уже существующего «нет/нет»: 8 на модель. Без реверса, четверти, кромки.
      changes:
        - sql:
            sql: >-
              INSERT INTO door_configuration (leaf_type_id, frame_type_id, door_casing_type_id, frame_extensions_type_id, is_reverse, has_quarter)
              SELECT lt.id, ft.id, dct.id, fet.id, false, false
              FROM (VALUES
                (CAST(NULL AS VARCHAR), 'FET-014'),
                (CAST(NULL AS VARCHAR), 'FET-015'),
                ('DCT-010', CAST(NULL AS VARCHAR)),
                ('DCT-010', 'FET-014'),
                ('DCT-010', 'FET-015'),
                ('DCT-011', CAST(NULL AS VARCHAR)),
                ('DCT-011', 'FET-014'),
                ('DCT-011', 'FET-015')
              ) AS v(casing_code, extension_code)
              CROSS JOIN leaf_type lt
              CROSS JOIN frame_type ft
              LEFT JOIN door_casing_type dct ON dct.code = v.casing_code
              LEFT JOIN frame_extensions_type fet ON fet.code = v.extension_code
              WHERE lt.code IN ('LT-046', 'LT-047', 'LT-048', 'LT-049', 'LT-050', 'LT-051')
                AND ft.code = 'FT-004'
      rollback:
        - sql:
            sql: >-
              DELETE FROM door_configuration
              WHERE door_casing_type_id IN (SELECT id FROM door_casing_type WHERE code IN ('DCT-010', 'DCT-011'))
                 OR frame_extensions_type_id IN (SELECT id FROM frame_extensions_type WHERE code IN ('FET-014', 'FET-015'))
