databaseChangeLog:
  # H2-совместимая версия changes/0069-door-casing-type-length-range-index.yaml (см. change
  # link-modo-onda-casing-length-to-leaf-height). Оригинальный файл не редактируется — он уже
  # применён к PostgreSQL. Эта версия используется только для профиля desktop (см. context
  # "desktop" на include в db.changelog-master.yaml). Итоговая уникальность идентична оригиналу;
  # отличается только техника — H2 не поддерживает функциональные и partial unique-индексы.
  # Колонки door_casing_type_key, min_value_norm и max_value_norm уже существуют (добавлены
  # changes-desktop-overrides/0006-door-configuration-catalog.yaml и
  # changes-desktop-overrides/0062-frame-type-height-range-index.yaml соответственно), поэтому
  # здесь достаточно DROP + CREATE UNIQUE INDEX без ALTER TABLE.
  - changeSet:
      id: 0069-1-drop-liner-dimension-option-door-casing-type-index
      author: furniture-calculator
      changes:
        - sql:
            sql: DROP INDEX uk_liner_dimension_option_door_casing_type

  - changeSet:
      id: 0069-2-recreate-liner-dimension-option-door-casing-type-index-with-range
      author: furniture-calculator
      changes:
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uk_liner_dimension_option_door_casing_type ON liner_dimension_option (
                door_casing_type_key, liner_dimension_type_id, value, min_value_norm, max_value_norm
              )
