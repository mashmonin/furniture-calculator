plugins {
	id 'java'
	id 'application'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.example'
// "-PappVersion=X.Y.Z" переопределяет версию проекта — используется, в частности,
// для CFBundleVersion desktop-сборки (см. ниже). Не "-Pversion": project.version
// уже имеет значение по умолчанию ("unspecified") само по себе, findProperty его
// всегда находит, и ?: тут никогда не сработал бы.
version = findProperty('appVersion') ?: '0.0.1-SNAPSHOT'
description = 'Furniture calculator backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
		// Явный vendor — иначе Gradle без разбора берёт первый подходящий JDK 21,
		// уже установленный на машине (см. settings.gradle, foojay-resolver-convention).
		// На Apple Silicon Mac, где JDK 21 ставили через "brew install openjdk@21"
		// (см. openspec/changes/add-arm64-desktop-build-support), это молча
		// зарезолвилось в Homebrew-сборку: её libfontmanager.dylib жёстко прошит на
		// /usr/local/opt/harfbuzz/... с машины, собиравшей сам JDK — на чужой машине
		// без такого Homebrew-пакета экспорт в Excel (Apache POI → AWT/Font) падал с
		// HTTP 500 (UnsatisfiedLinkError). Adoptium — официальная portable-сборка,
		// без зашитых абсолютных путей на Homebrew.
		vendor = JvmVendorSpec.ADOPTIUM
	}
}

repositories {
	mavenCentral()
}

javafx {
	version = '21.0.5'
	modules = ['javafx.controls', 'javafx.web']
}

application {
	// Запуск desktop-обёртки: ./gradlew run (обычный сервер по-прежнему через bootRun)
	mainClass = 'com.example.furniturecalculator.desktop.DesktopLauncher'
}

// Spring Boot Gradle-плагин по умолчанию берёт mainClass для bootRun из application{}
// (см. выше), если плагин application подключён — из-за этого ./gradlew bootRun
// пытался запускать DesktopLauncher вместо обычного backend. Явно отвязываем.
tasks.named('bootRun') {
	mainClass = 'com.example.furniturecalculator.FurnitureCalculatorApplication'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.poi:poi-ooxml:5.3.0'
	// PDF коммерческого предложения (см. change add-commercial-offer-pdf-export) и декодер WebP для ImageIO
	implementation 'com.github.librepdf:openpdf:2.0.3'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- Упаковка desktop-дистрибутива (.dmg) через jlink + jpackage ---
// Только macOS в этой итерации (см. design.md change add-desktop-app-packaging).
// classpath собирается через стандартный installDist (application-плагин):
// JavaFX-jar'ы отделяются от остального classpath — современный JavaFX требует
// module-path (--add-modules), простое помещение javafx-jar'ов в -cp не работает
// ("JavaFX runtime components are missing"), а объединение их в module-path вместе
// с backend-классами ловит конфликт split-package. Поэтому backend остаётся на
// classpath (jpackage --input), а JavaFX — отдельно (jpackage --app-content),
// подключается во время выполнения через --java-options с $APPDIR.
def javaLauncher = javaToolchains.launcherFor(java.toolchain)

// Архитектура текущей JDK (не хоста!) — тот же сигнал, что уже использует
// org.openjfx.javafxplugin для выбора classifier'а JavaFX-jar'ов (mac / mac-aarch64).
// Кросс-сборка невозможна: jlink/jpackage всегда встраивают JRE той же архитектуры,
// что и JDK, из которой они запущены (см. design.md change add-arm64-desktop-build-support).
def desktopArch = {
	def raw = System.getProperty('os.arch')
	if (raw == 'amd64' || raw == 'x86_64') {
		return 'x86_64'
	}
	if (raw == 'aarch64' || raw == 'arm64') {
		return 'aarch64'
	}
	return raw
}.call()

// Определяет ветку упаковки (тип пакета, иконка, идентификатор для замены версии) в
// desktopAppImage/desktopVerifyArch ниже — см. design.md change
// add-windows-desktop-build-support.
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

// Версия для CFBundleVersion (задача 4.3) и для Implementation-Version в манифесте
// jar'а (используется UpdateCheckService для сравнения с latestVersion — задача 5.2):
// без "-SNAPSHOT", и с первой цифрой не меньше 1 (иначе macOS отказывается собирать
// .dmg) — у project.version сейчас "0.0.1-SNAPSHOT". Переопределить конкретную
// версию сборки — "-PappVersion=X.Y.Z" при запуске Gradle.
def desktopAppVersion = {
	def v = project.version.toString().replace('-SNAPSHOT', '')
	def parts = v.split('\\.')
	if (parts[0] == '0') {
		parts[0] = '1'
		v = parts.join('.')
	}
	return v
}.call()

tasks.named('jar') {
	manifest {
		attributes 'Implementation-Version': desktopAppVersion
	}
}

def desktopRuntimeModules = [
	'java.base', 'java.compiler', 'java.desktop', 'java.instrument', 'java.logging',
	'java.management', 'java.naming', 'java.net.http', 'java.prefs', 'java.rmi',
	'java.scripting', 'java.security.jgss', 'java.sql', 'java.sql.rowset',
	'java.transaction.xa', 'java.xml', 'jdk.crypto.ec', 'jdk.jfr', 'jdk.unsupported',
	'jdk.localedata', 'javafx.controls', 'javafx.web'
].join(',')

// Под-путь по архитектуре — чтобы сборки под разные архитектуры (например, тот же
// checkout собранный сначала на Intel, потом на Apple Silicon Mac) не затирали
// output друг друга и не путались между собой.
def desktopAppName = 'Я-Конфигуратор'
def desktopAppLibDir = layout.buildDirectory.dir("desktop/${desktopArch}/app-lib")
def desktopFxLibsDir = layout.buildDirectory.dir("desktop/${desktopArch}/fxlibs")
def desktopRuntimeDir = layout.buildDirectory.dir("desktop/${desktopArch}/runtime")
def desktopDmgDir = layout.buildDirectory.dir("desktop/${desktopArch}/dmg")

tasks.register('desktopAppLibs', Sync) {
	group = 'desktop packaging'
	description = 'Classpath backend\'а для jpackage (все runtime-jar\'ы, кроме JavaFX)'
	dependsOn tasks.named('installDist')
	from(layout.buildDirectory.dir('install/furniture-calculator/lib')) {
		exclude 'javafx-*.jar'
	}
	into desktopAppLibDir
}

tasks.register('desktopFxLibs', Sync) {
	group = 'desktop packaging'
	description = 'JavaFX runtime-jar\'ы отдельно — идут на --module-path, не на classpath'
	dependsOn tasks.named('installDist')
	from(layout.buildDirectory.dir('install/furniture-calculator/lib')) {
		include 'javafx-*.jar'
	}
	into desktopFxLibsDir
}

tasks.register('desktopFrontendBuild', Exec) {
	group = 'desktop packaging'
	description = 'Прод-сборка фронтенда (npm run build) для вложения в desktop-дистрибутив'
	workingDir = layout.projectDirectory.dir('../frontend')
	// Exec (в отличие от шага workflow) не идёт через shell — на Windows "npm" сам по
	// себе не исполняемый файл (это npm.cmd), ProcessBuilder не подставляет расширение
	// сам, как это сделал бы shell ("A problem occurred starting process 'command
	// 'npm''").
	commandLine isWindows ? 'npm.cmd' : 'npm', 'run', 'build'
}

tasks.register('desktopFrontendJar', Jar) {
	group = 'desktop packaging'
	description = 'Упаковывает собранный фронтенд в отдельный jar (static/) — jpackage прописывает в classpath только jar\'ы из --input, голую директорию рядом с ними он не подхватывает'
	dependsOn tasks.named('desktopFrontendBuild')
	archiveBaseName = 'furniture-calculator-frontend'
	destinationDirectory = layout.buildDirectory.dir('desktop/frontend-jar')
	from(layout.projectDirectory.dir('../frontend/dist')) {
		into 'static'
	}
}

tasks.register('desktopFrontendAssets', Copy) {
	group = 'desktop packaging'
	description = 'Добавляет jar с фронтендом в classpath desktop-дистрибутива — раздаётся backend\'ом вместо dev-сервера, см. design.md'
	dependsOn tasks.named('desktopAppLibs'), tasks.named('desktopFrontendJar')
	from(tasks.named('desktopFrontendJar').flatMap { it.archiveFile })
	into desktopAppLibDir
}

tasks.register('desktopJlinkRuntime', Exec) {
	group = 'desktop packaging'
	description = 'Собирает урезанный JRE (jlink) под нужные модули, включая JavaFX'
	dependsOn tasks.named('desktopFxLibs')
	inputs.dir(desktopFxLibsDir)
	outputs.dir(desktopRuntimeDir)
	doFirst {
		delete(desktopRuntimeDir)
	}
	def jdkHome = javaLauncher.get().metadata.installationPath
	commandLine "${jdkHome}/bin/jlink",
			// Разделитель путей в --module-path платформенный (":" на macOS/Linux,
			// ";" на Windows, где ":" зарезервирован под букву диска) — File.pathSeparator
			// подставляет нужный, хардкод ":" ломал сборку на Windows.
			'--module-path', "${jdkHome}/jmods${File.pathSeparator}${desktopFxLibsDir.get().asFile}",
			'--add-modules', desktopRuntimeModules,
			'--output', desktopRuntimeDir.get().asFile.absolutePath,
			'--strip-debug', '--no-header-files', '--no-man-pages', '--compress', 'zip-6'
}

tasks.register('desktopAppImage', Exec) {
	group = 'desktop packaging'
	description = 'Собирает установщик (.dmg на macOS, .msi на Windows) через jpackage со встроенным JRE и JavaFX WebView-обёрткой'
	dependsOn tasks.named('desktopFrontendAssets'), tasks.named('desktopFxLibs'), tasks.named('desktopJlinkRuntime')
	inputs.dir(desktopAppLibDir)
	inputs.dir(desktopFxLibsDir)
	inputs.dir(desktopRuntimeDir)
	outputs.dir(desktopDmgDir)
	doFirst {
		delete(desktopDmgDir)
		mkdir(desktopDmgDir)
	}
	def jdkHome = javaLauncher.get().metadata.installationPath
	def mainJarName = tasks.named('jar').get().archiveFileName.get()
	inputs.property('appVersion', desktopAppVersion)
	// Тип пакета и иконка различаются по ОС; --win-upgrade-uuid/--mac-package-identifier —
	// оба решают одну и ту же задачу (повторная установка заменяет приложение, а не
	// создаёт вторую копию, см. design.md), но это два разных флага jpackage.
	def packageType = isWindows ? 'msi' : 'dmg'
	def iconFile = file("src/main/resources/desktop/app-icon.${isWindows ? 'ico' : 'icns'}")
	// WiX собирает MSI-базу в кодовой странице 1252 (Western European) по умолчанию —
	// кириллица в неё физически не помещается (jpackage/light.exe падает с
	// "error LGHT0311: A string was provided with characters that are not available
	// in the specified database code page '1252'"), это открытая нерешённая проблема
	// в OpenJDK (JDK-8290471), не наша ошибка. На Windows используем латиницу — только
	// там, macOS не затронут (см. design.md change add-windows-desktop-build-support,
	// правку пользователя).
	def jpackageName = isWindows ? 'YaKonfigurator' : desktopAppName
	def commonArgs = [
			"${jdkHome}/bin/jpackage",
			'--type', packageType,
			'--name', jpackageName,
			'--app-version', desktopAppVersion,
			'--vendor', 'Furniture Calculator',
			'--icon', iconFile.absolutePath,
			'--input', desktopAppLibDir.get().asFile.absolutePath,
			'--main-jar', mainJarName,
			'--main-class', 'com.example.furniturecalculator.desktop.DesktopLauncher',
			'--runtime-image', desktopRuntimeDir.get().asFile.absolutePath,
			'--app-content', desktopFxLibsDir.get().asFile.absolutePath,
			// $APPDIR у jpackage — это <install>/app (Contents/app на macOS), а
			// --app-content кладёт свою директорию рядом, в <install>/fxlibs
			// (Contents/fxlibs на macOS) — отсюда "..". На Windows раскладка ожидается
			// такой же (не проверено вживую на момент написания — см. design.md change
			// add-windows-desktop-build-support, Decisions/Risks; если WebView не
			// находит модули, поправить путь здесь для Windows-ветки).
			'--java-options', '--module-path $APPDIR/../fxlibs --add-modules javafx.controls,javafx.web',
			'--dest', desktopDmgDir.get().asFile.absolutePath,
	]
	def platformArgs = isWindows
			? [
				// НЕ МЕНЯТЬ это значение — стабильный между сборками GUID, как и
				// --mac-package-identifier ниже: повторная установка .msi поверх старой
				// версии заменяет приложение, а не создаёт вторую копию. Смена UUID
				// равносильна потере этого механизма для уже установивших пользователей
				// (см. design.md change add-windows-desktop-build-support).
				'--win-upgrade-uuid', '426abc10-ac1d-454f-b9fc-7b344800e814',
				'--win-menu',
				'--win-shortcut',
			]
			: [
				// Стабильный между сборками — повторная установка .dmg поверх старой
				// заменяет приложение, а не создаёт вторую копию (см. design.md).
				'--mac-package-identifier', 'com.example.furniturecalculator',
			]
	if (isWindows) {
		// ProcessBuilder на Windows кодирует argv через системную ANSI-кодовую
		// страницу (sun.jnu.encoding), а не UTF-8 — кириллица в --name
		// ("Я-Конфигуратор") превращалась в "?" ещё до того, как jpackage получал
		// управление ("Invalid Application name: ?-????????????"). @argfile jpackage
		// читает как обычный текст (UTF-8), в обход этого пути кодирования — сюда
		// уходят все аргументы, кроме самого пути к exe (он ASCII, кодированию не
		// подвержен).
		def jpackageExe = commonArgs[0]
		def argFileContent = (commonArgs.drop(1) + platformArgs)
				.collect { it.contains(' ') ? "\"${it}\"" : it }
				.join('\n')
		File argFile = layout.buildDirectory.file("desktop/${desktopArch}/jpackage-args.txt").get().asFile
		argFile.parentFile.mkdirs()
		argFile.write(argFileContent, 'UTF-8')
		commandLine jpackageExe, "@${argFile.absolutePath}"
	} else {
		commandLine commonArgs + platformArgs
	}
	doLast {
		// jpackage сам называет файл "<name>-<version>.<type>" — добавляем архитектуру
		// в имя файла (не в --name/CFBundleName выше, чтобы не менять то, что видит
		// пользователь в самом приложении), см. design.md.
		File dmgDir = desktopDmgDir.get().asFile
		File original = new File(dmgDir, "${jpackageName}-${desktopAppVersion}.${packageType}")
		File renamed = new File(dmgDir, "${jpackageName}-${desktopAppVersion}-${desktopArch}.${packageType}")
		if (!original.renameTo(renamed)) {
			throw new GradleException("Не удалось переименовать ${original} в ${renamed}")
		}
	}
}

tasks.register('desktopVerifyArch') {
	group = 'desktop packaging'
	description = 'Проверяет, что бинарник внутри собранного .dmg соответствует ожидаемой архитектуре (aarch64/x86_64) — только на macOS, задействует hdiutil/file, которых нет на Windows'
	dependsOn tasks.named('desktopAppImage')
	doLast {
		if (isWindows) {
			// hdiutil/file — macOS-специфичные утилиты, аналога этой проверки под
			// Windows пока нет (см. design.md change add-windows-desktop-build-support,
			// задача 2.3) — не считается ошибкой, просто не выполняется.
			logger.lifecycle('desktopVerifyArch пропущен: проверка архитектуры через hdiutil/file специфична для macOS.')
			return
		}
		File dmgFile = new File(desktopDmgDir.get().asFile, "${desktopAppName}-${desktopAppVersion}-${desktopArch}.dmg")
		File mountPoint = layout.buildDirectory.dir("desktop/${desktopArch}/dmg-mount").get().asFile
		mountPoint.mkdirs()
		Process attach = ['hdiutil', 'attach', dmgFile.absolutePath, '-nobrowse', '-readonly', '-mountpoint',
				mountPoint.absolutePath].execute()
		attach.waitFor()
		if (attach.exitValue() != 0) {
			throw new GradleException("hdiutil attach завершился с ошибкой: ${attach.err.text}")
		}
		try {
			File binary = new File(mountPoint, "${desktopAppName}.app/Contents/MacOS/${desktopAppName}")
			Process fileProcess = ['file', binary.absolutePath].execute()
			fileProcess.waitFor()
			String fileOutput = fileProcess.in.text
			String expectedMarker = desktopArch == 'aarch64' ? 'arm64' : 'x86_64'
			if (!fileOutput.contains(expectedMarker)) {
				throw new GradleException(
						"Архитектура бинарника не совпадает с ожидаемой (${expectedMarker}): ${fileOutput.trim()}")
			}
			logger.lifecycle("Архитектура подтверждена (${expectedMarker}): ${fileOutput.trim()}")
		} finally {
			['hdiutil', 'detach', mountPoint.absolutePath].execute().waitFor()
		}
	}
}

tasks.named('desktopAppImage') {
	finalizedBy tasks.named('desktopVerifyArch')
}
