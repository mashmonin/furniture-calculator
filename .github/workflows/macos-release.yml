name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (semver, например 1.2.0)"
        required: true
        type: string

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Проверить формат версии
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версия '$VERSION' не похожа на semver (ожидается X.Y.Z)"
            exit 1
          fi

      - name: Убедиться, что релиз с этим тегом ещё не публиковался
        run: |
          VERSION="${{ inputs.version }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Релиз v$VERSION уже опубликован — сборка остановлена до начала"
            exit 1
          fi
          echo "Версия v$VERSION свободна, можно собирать"

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить npm-зависимости фронтенда
        working-directory: frontend
        run: npm ci

      - name: Собрать дистрибутив (jlink + jpackage)
        working-directory: backend
        run: ./gradlew desktopAppImage -PappVersion=${{ inputs.version }}

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: backend/build/desktop/${{ matrix.arch }}/dmg/Я-Конфигуратор-${{ inputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Скачать оба дистрибутива
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true

      - name: Опубликовать релиз
        run: |
          gh release create "v${{ inputs.version }}" dist/*.dmg \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --notes ""
