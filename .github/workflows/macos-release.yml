name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (semver, например 1.2.0)"
        required: true
        type: string

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Проверить формат версии
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версия '$VERSION' не похожа на semver (ожидается X.Y.Z)"
            exit 1
          fi

      - name: Убедиться, что релиз с этим тегом ещё не публиковался
        run: |
          VERSION="${{ inputs.version }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Релиз v$VERSION уже опубликован — сборка остановлена до начала"
            exit 1
          fi
          echo "Версия v$VERSION свободна, можно собирать"

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: aarch64
            ext: dmg
            artifactName: release-macos-aarch64
            appName: Я-Конфигуратор
          - os: macos-15-intel
            arch: x86_64
            ext: dmg
            artifactName: release-macos-x86_64
            appName: Я-Конфигуратор
          - os: windows-latest
            arch: x86_64
            ext: msi
            artifactName: release-windows-x86_64
            # Кириллица не помещается в кодовую страницу 1252 MSI-базы WiX (открытая
            # проблема JDK-8290471) — на Windows используется латинское имя, см.
            # backend/build.gradle (jpackageName) и design.md change
            # add-windows-desktop-build-support.
            appName: YaKonfigurator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить npm-зависимости фронтенда
        working-directory: frontend
        run: npm ci

      # windows-latest поставляется с WiX Toolset v3 (нужен jpackage --type msi), но
      # его bin-директория не добавлена в PATH по умолчанию — jpackage не найдёт
      # candle.exe/light.exe без этого шага. Версия ищется через glob, не хардкодится,
      # чтобы не повторить историю с выведенным из эксплуатации macos-13 (см. commit
      # истории этого файла) — раннер может обновить минорную версию WiX сам.
      - name: Добавить WiX Toolset в PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wixDir) {
            Write-Error "WiX Toolset не найден в C:\Program Files (x86)"
            exit 1
          }
          $wixBin = Join-Path $wixDir.FullName "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      # ./gradlew — shell-скрипт, на Windows нужен gradlew.bat (отдельный шаг, а не
      # общая команда, — платформенно-специфичный исполняемый файл).
      - name: Собрать дистрибутив (jlink + jpackage)
        if: runner.os != 'Windows'
        working-directory: backend
        run: ./gradlew desktopAppImage -PappVersion=${{ inputs.version }}

      - name: Собрать дистрибутив (jlink + jpackage, Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        # -PappVersion=... обязательно в кавычках — без них PowerShell/cmd при вызове
        # .bat может разбить аргумент на части (наблюдалось: "-PappVersion=5" и
        # отдельно ".0.1", второе Gradle пытался выполнить как имя таска).
        run: .\gradlew.bat desktopAppImage "-PappVersion=${{ inputs.version }}"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: backend/build/desktop/${{ matrix.arch }}/dmg/${{ matrix.appName }}-${{ inputs.version }}-${{ matrix.arch }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Скачать все дистрибутивы
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Опубликовать релиз
        run: |
          gh release create "v${{ inputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --notes ""
